<div class="modal-overlay">
  <div class="modal-container">
    <header class="modal-header">
      <div class="header-title">
        <h2>עריכת משימה</h2>
        <span class="task-id">מזהה משימה: #{{ taskId }}</span>
      </div>
      <button class="btn-close" (click)="close()">×</button>
    </header>

    <form [formGroup]="editForm" (ngSubmit)="updateTask()">
      
      <div class="form-group">
        <label for="title">כותרת המשימה</label>
        <input 
          id="title"
          type="text" 
          formControlName="title" 
          class="form-control">
      </div>

      <div class="form-group">
        <label for="description">תיאור</label>
        <textarea 
          id="description"
          formControlName="description" 
          class="form-control" 
          rows="3"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="status">סטטוס</label>
          <select id="status" formControlName="status" class="form-control">
            <option value="todo">לביצוע (To Do)</option>
            <option value="in_progress">בעבודה (In Progress)</option>
            <option value="done">הושלם (Done)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="priority">עדיפות</label>
          <select id="priority" formControlName="priority" class="form-control">
            <option value="low">נמוכה</option>
            <option value="normal">רגילה</option>
            <option value="high">גבוהה</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="due_date">תאריך יעד</label>
          <input 
            id="due_date"
            type="date" 
            formControlName="due_date" 
            class="form-control">
        </div>

        <div class="form-group">
          <label for="assignee_id">מזהה מבצע (ID)</label>
          <input 
            id="assignee_id"
            type="number" 
            formControlName="assignee_id" 
            class="form-control">
        </div>
      </div>

      <footer class="modal-footer">
        <button type="button" class="btn-delete" (click)="deleteTask()">
          🗑️ מחק משימה
        </button>
        
        <div class="actions">
          <button type="button" class="btn-cancel" (click)="close()">ביטול</button>
          <button 
            type="submit" 
            class="btn-save" 
            [disabled]="editForm.invalid || isLoading">
            {{ isLoading ? 'מעדכן...' : 'שמור שינויים' }}
          </button>
        </div>
      </footer>

      @if (errorMessage) {
        <div class="alert-error">{{ errorMessage }}</div>
      }
    </form>
  </div>
</div>
