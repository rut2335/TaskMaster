<div class="modal-overlay">
  <div class="modal-container">
    <header class="modal-header">
      <h2>יצירת משימה חדשה</h2>
      <button class="btn-close" (click)="close()">×</button>
    </header>

    <form [formGroup]="taskForm" (ngSubmit)="saveTask()">
      
      <div class="form-group">
        <label for="title">כותרת המשימה*</label>
        <input 
          id="title"
          type="text" 
          formControlName="title" 
          placeholder="מה צריך לעשות?"
          class="form-control">
        @if (taskForm.get('title')?.invalid && taskForm.get('title')?.touched) {
          <small class="error-text">חובה להזין כותרת למשימה</small>
        }
      </div>

      <div class="form-group">
        <label for="description">תיאור</label>
        <textarea 
          id="description"
          formControlName="description" 
          placeholder="פרטים נוספים על המשימה..."
          class="form-control" 
          rows="3"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="status">סטטוס</label>
          <select id="status" formControlName="status" class="form-control">
            <option value="todo">לביצוע (To Do)</option>
            <option value="in_progress">בעבודה (In Progress)</option>
            <option value="done">הושלם (Done)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="priority">עדיפות</label>
          <select id="priority" formControlName="priority" class="form-control">
            <option value="low">נמוכה</option>
            <option value="normal">רגילה</option>
            <option value="high">גבוהה</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="dueDate">תאריך יעד</label>
          <input 
            id="dueDate"
            type="date" 
            formControlName="dueDate" 
            class="form-control">
        </div>

        <div class="form-group">
          <label for="assigneeId">מזהה מבצע (ID)</label>
          <input 
            id="assigneeId"
            type="number" 
            formControlName="assigneeId" 
            placeholder="למשל: 2"
            class="form-control">
        </div>
      </div>

      <footer class="modal-footer">
        <button type="button" class="btn-cancel" (click)="close()">ביטול</button>
        <button 
          type="submit" 
          class="btn-save" 
          [disabled]="taskForm.invalid || isLoading">
          {{ isLoading ? 'שומר...' : 'צור משימה' }}
        </button>
      </footer>

      @if (errorMessage) {
        <div class="alert-error">{{ errorMessage }}</div>
      }
    </form>
  </div>
</div>
