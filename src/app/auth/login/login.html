<div class="auth-wrap">
    <div class="auth-card">
        <div class="visual">
            <div class="visual-inner">
                <h1>ברוכים שוב הבאים!</h1>
                <p>התחבר כדי לגשת לצוותים, פרויקטים ומשימות — הכל במקום אחד.</p>
            </div>
            <svg class="waves" viewBox="0 0 500 150" preserveAspectRatio="none">
                <path d="M-2.54,44.09 C149.99,150.00 271.27,-49.98 503.54,49.99 L500.00,0.00 L0.00,0.00 Z" style="stroke: none; fill: rgba(255,255,255,0.06);"></path>
            </svg>
        </div>

        <div class="form-side">
            <h2>התחברות</h2>
            <p class="lead">הכנס את פרטיך כדי להמשיך</p>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <div class="form-row">
                    <label>אימייל</label>
                    <input type="email" formControlName="email" placeholder="example@mail.com">
                    <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error">אימייל לא תקין</small>
                </div>

                <div class="form-row">
                    <label>סיסמה</label>
                    <input type="password" formControlName="password" placeholder="לפחות 6 תווים">
                    <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error">הסיסמה קצרה מדי</small>
                </div>

                <div *ngIf="errorMessage" class="error global">{{ errorMessage }}</div>

                <button class="btn-primary" type="submit" [disabled]="loginForm.invalid">התחבר</button>
            </form>

            <div class="alt">אין לך עדיין חשבון? <a routerLink="/register">הרשם כאן</a></div>
        </div>
    </div>
</div>
