<div class="auth-page">
    <div class="auth-card">
        <aside class="auth-visual">
            <h3>ברוכים שוב הבאים!</h3>
            <p>התחבר כדי לגשת לצוותים, פרויקטים ומשימות — ממש במקום אחד.</p>
        </aside>

        <section class="auth-form">
            <h2>התחברות</h2>
            <div class="subtitle">הכנס את פרטיך כדי להמשיך</div>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <label>אימייל</label>
                    <input type="email" formControlName="email" placeholder="example@mail.com">
                    <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error">אימייל לא תקין</small>
                </div>

                <div class="form-group">
                    <label>סיסמה</label>
                    <input type="password" formControlName="password" placeholder="לפחות 6 תווים">
                    <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error">הסיסמה קצרה מדי</small>
                </div>

                <div *ngIf="errorMessage" class="error" style="margin-bottom:12px">{{ errorMessage }}</div>

                <button type="submit" [disabled]="loginForm.invalid">התחבר</button>
            </form>

            <div class="small-link">אין לך עדיין חשבון? <a routerLink="/register">הרשם כאן</a></div>
        </section>
    </div>
</div>
