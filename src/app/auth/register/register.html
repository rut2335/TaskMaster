<div class="auth-page">
    <div class="auth-card">
        <aside class="auth-visual">
            <h3>ברוכים הבאים!</h3>
            <p>צור חשבון כדי להתחיל לנהל צוותים, פרויקטים ומשימות בקלות ובמהירות.</p>
        </aside>

        <section class="auth-form">
            <h2>יצירת חשבון חדש</h2>
            <div class="subtitle">הצטרפו עכשיו — זה חינם ותוך דקות ספורות</div>

            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <label>שם מלא</label>
                    <input type="text" formControlName="name" placeholder="הכנס שם מלא">
                    <small *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched" class="error">שם חייב להכיל לפחות 2 תווים</small>
                </div>

                <div class="form-group">
                    <label>אימייל</label>
                    <input type="email" formControlName="email" placeholder="example@mail.com">
                    <small *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="error">אימייל לא תקין</small>
                </div>

                <div class="form-group">
                    <label>סיסמה</label>
                    <input type="password" formControlName="password" placeholder="לפחות 6 תווים">
                    <small *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="error">הסיסמה קצרה מדי</small>
                </div>

                <div *ngIf="errorMessage" class="error" style="margin-bottom:12px">{{ errorMessage }}</div>

                <button type="submit" [disabled]="registerForm.invalid">הרשמה</button>
            </form>

            <div class="small-link">כבר יש לך חשבון? <a routerLink="/login">התחבר כאן</a></div>
        </section>
    </div>
</div>
