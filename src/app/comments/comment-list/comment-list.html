<div class="comments-container">
  <header class="comments-header">
    <h2>💬 תגובות למשימה #{{ taskId }}</h2>
    <button class="btn-close" (click)="close()">×</button>
  </header>

  <div class="comments-feed">
    @for (comment of commentService.comments(); track comment.id) {
      <div class="comment-wrapper" [class.own-comment]="comment.user_id === currentUserId">
        <div class="avatar">{{ comment.author_name?.charAt(0) || 'U' }}</div>
        <div class="bubble">
          <div class="comment-meta">
            <span class="author">{{ comment.author_name }}</span>
            <span class="time">{{ comment.created_at | date:'dd/MM HH:mm' }}</span>
          </div>
          <p class="text">{{ comment.body }}</p>
        </div>
      </div>
    } @empty {
      <div class="no-comments">אין עדיין תגובות. תהיו הראשונים להגיב!</div>
    }
  </div>

  <footer class="comment-input-area">
    <form [formGroup]="commentForm" (ngSubmit)="sendComment()">
      <textarea 
        formControlName="content" 
        placeholder="כתוב תגובה..." 
        rows="2"
        (keydown.enter)="$event.preventDefault(); sendComment()">
      </textarea>
      <button type="submit" [disabled]="commentForm.invalid || isSending">
        {{ isSending ? 'שולח...' : 'שליחה' }}
      </button>
    </form>
  </footer>
</div>
